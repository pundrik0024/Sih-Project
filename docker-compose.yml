version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unishield-soc-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cyber_threat_platform.db
      - SECRET_KEY=unishield-production-secure-key-2026-sih-ntro
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unishield-soc-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
